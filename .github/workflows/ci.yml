name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      docs_only: ${{ steps.changes.outputs.docs_only }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: changes
        run: node scripts/ci.mjs classify

  docs:
    needs: changes
    if: needs.changes.outputs.docs_only == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          package-manager-cache: false
      # Both checks use Node built-ins; documentation edits need no dependency install.
      - run: npm run check:docs && npm run check:package

  check:
    name: check (${{ matrix.node-version }})
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # One list for the whole SDK family: install and verification cannot drift apart.
    env:
      PI_SDK_PACKAGES: pi-coding-agent pi-tui pi-agent-core pi-ai pi-codemode pi-mcp pi-telemetry
    strategy:
      fail-fast: false
      matrix:
        node-version: ['22.19.0', '24']
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      # npm ci installs the single supported SDK; the whole Pi family must match that pin.
      - name: Verify Pi SDK versions
        run: |
          node -e 'const pinned = require("./package.json").devDependencies["@earendil-works/pi-coding-agent"]; for (const name of process.env.PI_SDK_PACKAGES.split(" ")) { const key = "@earendil-works/" + name; const actual = require("./node_modules/" + key + "/package.json").version; if (actual !== pinned) throw new Error(key + ": expected " + pinned + ", got " + actual); }'

      - name: Validate
        run: npm run check

  result:
    name: CI result
    if: always()
    needs: [changes, docs, check]
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - run: node scripts/ci.mjs aggregate
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
