name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ['22.19.0', '24']
        pi-version: ['1.2.0', '1.3.0']
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Pi packages depend on each other with ^ version ranges, so pin the
      # entire SDK family in the 1.2 leg to avoid mixed Pi SDK imports.
      - name: Install Pi SDK under test
        if: matrix.pi-version != '1.3.0'
        run: |
          npm install --no-save --package-lock=false --no-audit --no-fund \
            @earendil-works/pi-coding-agent@${{ matrix.pi-version }} \
            @earendil-works/pi-tui@${{ matrix.pi-version }} \
            @earendil-works/pi-agent-core@${{ matrix.pi-version }} \
            @earendil-works/pi-ai@${{ matrix.pi-version }} \
            @earendil-works/pi-codemode@${{ matrix.pi-version }} \
            @earendil-works/pi-mcp@${{ matrix.pi-version }} \
            @earendil-works/pi-telemetry@${{ matrix.pi-version }}

      - name: Verify Pi SDK versions
        env:
          PI_SDK_VERSION: ${{ matrix.pi-version }}
        run: |
          node -e 'for (const name of ["pi-coding-agent", "pi-tui", "pi-agent-core", "pi-ai", "pi-codemode", "pi-mcp", "pi-telemetry"]) { const actual = require("./node_modules/@earendil-works/" + name + "/package.json").version; if (actual !== process.env.PI_SDK_VERSION) throw new Error(name + ": expected " + process.env.PI_SDK_VERSION + ", got " + actual); }'

      - name: Validate
        run: npm run check
