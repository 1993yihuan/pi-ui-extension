name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      docs_only: ${{ steps.changes.outputs.docs_only }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: changes
        run: node scripts/ci.mjs classify

  docs:
    needs: changes
    if: needs.changes.outputs.docs_only == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          package-manager-cache: false
      # Both checks use Node built-ins; documentation edits need no dependency install.
      - run: npm run check:docs && npm run check:package

  check:
    name: check (${{ matrix.node-version }}, ${{ matrix.pi-version }})
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node-version: ['22.19.0', '24']
        pi-version: ['1.2.0', '1.3.0', '1.4.0']
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      # Pin the entire SDK family so transitive ranges cannot mix Pi versions.
      - name: Install Pi SDK under test
        if: matrix.pi-version != '1.4.0'
        run: |
          npm install --no-save --package-lock=false --no-audit --no-fund \
            @earendil-works/pi-coding-agent@${{ matrix.pi-version }} \
            @earendil-works/pi-tui@${{ matrix.pi-version }} \
            @earendil-works/pi-agent-core@${{ matrix.pi-version }} \
            @earendil-works/pi-ai@${{ matrix.pi-version }} \
            @earendil-works/pi-codemode@${{ matrix.pi-version }} \
            @earendil-works/pi-mcp@${{ matrix.pi-version }} \
            @earendil-works/pi-telemetry@${{ matrix.pi-version }}

      - name: Verify Pi SDK versions
        env:
          PI_SDK_VERSION: ${{ matrix.pi-version }}
        run: |
          node -e 'for (const name of ["pi-coding-agent", "pi-tui", "pi-agent-core", "pi-ai", "pi-codemode", "pi-mcp", "pi-telemetry"]) { const actual = require("./node_modules/@earendil-works/" + name + "/package.json").version; if (actual !== process.env.PI_SDK_VERSION) throw new Error(name + ": expected " + process.env.PI_SDK_VERSION + ", got " + actual); }'

      - name: Validate
        run: npm run check

  result:
    name: CI result
    if: always()
    needs: [changes, docs, check]
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - run: node scripts/ci.mjs aggregate
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
