name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Validate release tag and main ancestry
        if: github.event_name == 'push'
        shell: bash
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release tag: $GITHUB_REF_NAME"
            exit 1
          fi
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "Release tag must point to a commit reachable from main."
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Ensure OIDC-capable npm
        run: npm install --global 'npm@>=11.5.1 <12'

      - name: Install dependencies
        run: npm ci

      - name: Validate
        run: npm run check

      - name: Verify tag matches package version
        if: github.event_name == 'push'
        shell: bash
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PACKAGE_VERSION="$(node -p 'require("./package.json").version')"
          if [ "$TAG_VERSION" != "$PACKAGE_VERSION" ]; then
            echo "Tag version ($TAG_VERSION) does not match package.json version ($PACKAGE_VERSION)."
            exit 1
          fi

      - name: Inspect package contents
        run: npm pack --dry-run

      - name: Publish to npm with OIDC
        if: github.event_name == 'push'
        run: npm publish --access public

      - name: Verify npm registry publication
        if: github.event_name == 'push'
        shell: bash
        run: |
          VERSION="$(node -p 'require("./package.json").version')"
          for attempt in {1..12}; do
            if npm view "pi-ui-extension@$VERSION" version --registry=https://registry.npmjs.org --prefer-online 2>/dev/null | grep -Fxq "$VERSION"; then
              echo "Verified pi-ui-extension@$VERSION on npm registry."
              exit 0
            fi
            echo "Registry not yet showing $VERSION (attempt $attempt/12)."
            sleep 10
          done
          echo "Published version $VERSION not visible in npm registry."
          exit 1

      - name: Create GitHub Release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --generate-notes --verify-tag
