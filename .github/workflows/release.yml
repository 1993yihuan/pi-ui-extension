name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing stable tag, e.g. v1.8.4'
        required: true
        type: string
      operation:
        description: 'Validate only, or recover an already uploaded npm package'
        required: true
        type: choice
        default: validate
        options: [validate, recover]

# Serialize all versions of this npm package, without replacing pending releases.
concurrency:
  group: release-pi-ui-extension
  queue: max
  cancel-in-progress: false

permissions:
  contents: read

env:
  RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
  RELEASE_MODE: ${{ github.event_name == 'push' && 'release' || inputs.operation }}

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
      actions: read
    outputs:
      tag: ${{ steps.prepare.outputs.tag }}
      sha: ${{ steps.prepare.outputs.sha }}
      mode: ${{ steps.prepare.outputs.mode }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          package-manager-cache: false
      - id: prepare
        name: Validate stable tag, main ancestry and exact-commit CI matrix
        run: node scripts/release.mjs prepare
        env:
          GH_TOKEN: ${{ github.token }}

  package:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      integrity: ${{ steps.package.outputs.integrity }}
      artifact_name: ${{ steps.package.outputs.artifact_name }}
    steps:
      # Keep workflow helpers separate from the immutable release source checkout.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          path: source
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Use verified npm version
        run: npm install --global npm@11.21.0 --ignore-scripts --no-audit --no-fund
      - run: npm ci --no-audit --no-fund && npm run check
        working-directory: source
      - id: package
        name: Pack and validate the exact publish artifact
        run: node scripts/release.mjs pack
        env:
          RELEASE_SOURCE: source
          RELEASE_SHA: ${{ needs.prepare.outputs.sha }}
          RELEASE_DIRECTORY: ${{ runner.temp }}/release
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.package.outputs.artifact_name }}
          path: |
            ${{ runner.temp }}/release/package.tgz
            ${{ runner.temp }}/release/release.json
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

  publish:
    needs: [prepare, package]
    if: needs.prepare.outputs.mode == 'release'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm install --global npm@11.21.0 --ignore-scripts --no-audit --no-fund
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.package.outputs.artifact_name }}
          path: ${{ runner.temp }}/release
      - name: Publish once, or verify an identical existing version
        run: node scripts/release.mjs publish
        env:
          RELEASE_SHA: ${{ needs.prepare.outputs.sha }}
          RELEASE_INTEGRITY: ${{ needs.package.outputs.integrity }}
          RELEASE_DIRECTORY: ${{ runner.temp }}/release

  verify:
    needs: [prepare, package, publish]
    if: >-
      !cancelled() && needs.package.result == 'success' &&
      (needs.publish.result == 'success' || needs.prepare.outputs.mode == 'recover')
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.package.outputs.artifact_name }}
          path: ${{ runner.temp }}/release
      - name: Verify registry commit, integrity and latest with a ten-minute deadline
        timeout-minutes: 11
        run: node scripts/release.mjs verify
        env:
          RELEASE_SHA: ${{ needs.prepare.outputs.sha }}
          RELEASE_INTEGRITY: ${{ needs.package.outputs.integrity }}
          RELEASE_DIRECTORY: ${{ runner.temp }}/release

  github-release:
    needs: [prepare, package, verify]
    if: ${{ !cancelled() && needs.verify.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.package.outputs.artifact_name }}
          path: ${{ runner.temp }}/release
      - name: Create or complete the GitHub Release without replacing existing notes
        run: node scripts/release.mjs github
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ needs.prepare.outputs.sha }}
          RELEASE_INTEGRITY: ${{ needs.package.outputs.integrity }}
          RELEASE_DIRECTORY: ${{ runner.temp }}/release
