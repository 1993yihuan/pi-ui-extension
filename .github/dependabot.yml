version: 2

updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Taipei"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    ignore:
      # Node type majors outrun the supported runtime; keep them on the Node 22 baseline.
      - dependency-name: "@types/node"
        update-types:
          - "version-update:semver-major"
    groups:
      pi-core:
        patterns:
          - "@earendil-works/pi-*"
      npm-dependencies:
        patterns:
          - "*"
        exclude-patterns:
          - "@earendil-works/pi-*"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:15"
      timezone: "Asia/Taipei"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(actions)"
    groups:
      github-actions:
        patterns:
          - "*"
